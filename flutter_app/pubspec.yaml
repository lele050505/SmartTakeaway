    sdk: flutter
  http: ^1.2.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
